name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just

      - name: Detect projects
        id: detect
        run: |
          if [ -f core/Cargo.toml ]; then echo "core=true" >> "$GITHUB_OUTPUT"; fi
          if [ -f frontend/package.json ]; then echo "frontend=true" >> "$GITHUB_OUTPUT"; fi

      - name: Install frontend deps
        if: steps.detect.outputs.frontend == 'true'
        run: pnpm -C frontend install

      - name: Rust tests
        if: steps.detect.outputs.core == 'true'
        run: cargo test --manifest-path core/Cargo.toml

      - name: Frontend tests
        if: steps.detect.outputs.frontend == 'true'
        run: pnpm -C frontend test
