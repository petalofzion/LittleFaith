name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: dtolnay/rust-toolchain@stable

      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@v2
        with:
          scandir: .

      - name: Rust checks (if core exists)
        if: ${{ hashFiles('core/Cargo.toml') != '' }}
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --manifest-path core/Cargo.toml

      - name: Frontend checks (if package.json exists)
        if: ${{ hashFiles('frontend/package.json') != '' }}
        run: |
          pnpm --dir frontend install
          pnpm --if-present --dir frontend lint
          pnpm --if-present --dir frontend test
